name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33"
          echo "SDK ready: $(ls $ANDROID_HOME/build-tools/)"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore: OK at $HOME/.android/debug.keystore"

      - name: Patch export_presets.cfg
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" godot/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' godot/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' godot/export_presets.cfg
          sed -i 's|package/signed=false|package/signed=true|g' godot/export_presets.cfg
          sed -i 's|export_path=""|export_path="diep-clone.apk"|g' godot/export_presets.cfg
          echo "Preset export_path: $(grep export_path godot/export_presets.cfg)"

      - name: Export Godot project
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          relative_project_path: ./godot
          archive_export_output: false
          cache: false
          export_debug: true
          use_preset_export_path: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Find APK
        run: |
          echo "Looking for APK..."
          find /home/runner -name "*.apk" 2>/dev/null | head -10
          find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diep-clone-apk
          path: "**/*.apk"
          retention-days: 30
