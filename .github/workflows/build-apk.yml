name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O /tmp/templates.tpz
          cd /tmp && unzip -q templates.tpz
          mv /tmp/templates/* "$TEMPLATES_DIR/"
          echo "Templates: $(ls $TEMPLATES_DIR | grep android)"

      - name: Install Android build-tools 33 and platforms
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" > /dev/null 2>&1
          echo "Build tools available:"
          ls "$ANDROID_HOME/build-tools/"
          echo "Platforms available:"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(none)"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore: $(ls -lh ~/.android/debug.keystore)"

      - name: Full Android SDK diagnostic
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          SDK="$ANDROID_HOME"
          BT=$(ls "$SDK/build-tools/" | tail -1)
          echo "=== JAVA ==="
          echo "JAVA_PATH: $JAVA_PATH"
          ls "$JAVA_PATH/bin/java" && echo "java OK" || echo "java MISSING"
          ls "$JAVA_PATH/bin/keytool" && echo "keytool OK" || echo "keytool MISSING"
          ls "$JAVA_PATH/bin/jarsigner" && echo "jarsigner OK" || echo "jarsigner MISSING"
          echo "=== SDK BUILD-TOOLS ($BT) ==="
          ls "$SDK/build-tools/$BT/" | grep -E "aapt2|apksigner|zipalign|dx|d8"
          ls "$SDK/build-tools/$BT/aapt2" && echo "aapt2 OK" || echo "aapt2 MISSING"
          ls "$SDK/build-tools/$BT/apksigner" && echo "apksigner OK" || echo "apksigner MISSING"
          ls "$SDK/build-tools/$BT/zipalign" && echo "zipalign OK" || echo "zipalign MISSING"
          echo "=== PLATFORM-TOOLS ==="
          ls "$SDK/platform-tools/adb" && echo "adb OK" || echo "adb MISSING"
          echo "=== TEMPLATES ==="
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/" | grep android
          echo "=== KEYSTORE ==="
          ls "$HOME/.android/debug.keystore" && echo "keystore OK" || echo "keystore MISSING"

      - name: Patch and verify export_presets.cfg
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" godot/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' godot/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' godot/export_presets.cfg
          sed -i 's|package/signed=false|package/signed=true|g' godot/export_presets.cfg
          echo "=== export_presets.cfg ==="
          cat godot/export_presets.cfg

      - name: Write editor settings and export APK
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          BT_VER=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          mkdir -p ~/.config/godot
          SF="$HOME/.config/godot/editor_settings-4.tres"
          echo '[gd_resource type="EditorSettings" format=3]'                        > "$SF"
          echo ''                                                                    >> "$SF"
          echo '[resource]'                                                          >> "$SF"
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\""               >> "$SF"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""  >> "$SF"
          echo 'export/android/debug_keystore_user = "androiddebugkey"'             >> "$SF"
          echo 'export/android/debug_keystore_pass = "android"'                     >> "$SF"
          echo "export/android/java_sdk_path = \"$JAVA_PATH\""                     >> "$SF"
          echo "export/android/apksigner = \"$ANDROID_HOME/build-tools/$BT_VER/apksigner\""  >> "$SF"
          echo "=== Settings (BT_VER=$BT_VER) ==="
          cat "$SF"
          mkdir -p /tmp/apk-out
          cd godot
          echo "=== Starting export ==="
          godot --headless --verbose --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk 2>&1 || true
          echo "=== Exit: $? ==="
          echo "=== Godot log files ==="
          find "$HOME/.local/share/godot/logs" -name "*.log" 2>/dev/null | head -3 | xargs cat 2>/dev/null || echo "(no log files)"
          echo "=== APK output ==="
          ls -lh /tmp/apk-out/ 2>/dev/null || echo "(empty)"

      - name: Fail if no APK
        run: test -f /tmp/apk-out/diep-clone.apk || (echo "APK not created" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/diep-clone.apk
          retention-days: 30
