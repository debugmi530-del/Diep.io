name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore created:"
          ls -lh ~/.android/debug.keystore

      - name: Install Godot 4.3 export templates
        run: |
          TDIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TDIR"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TDIR/"
          echo "Templates installed:"
          ls "$TDIR" | grep android

      - name: Install Godot 4.3 headless
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/gbin
          chmod +x /tmp/gbin/Godot_v4.3-stable_linux.x86_64
          echo "Godot version:"
          /tmp/gbin/Godot_v4.3-stable_linux.x86_64 --version

      - name: Write Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          SF="$HOME/.config/godot/editor_settings-4.tres"
          KEYSTORE="$HOME/.android/debug.keystore"
          JAVA_PATH="$(dirname $(dirname $(readlink -f $(which java))))"
          SDK="$ANDROID_HOME"
          BT="$(ls $SDK/build-tools/ | sort -V | tail -1)"
          cat > "$SF" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/apksigner = "$SDK/build-tools/$BT/apksigner"
          EOF
          echo "EditorSettings written:"
          cat "$SF"

      - name: Patch export_presets.cfg
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          CFG="godot/export_presets.cfg"
          mkdir -p /tmp/apk-out
          # Set keystore paths
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" "$CFG"
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' "$CFG"
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' "$CFG"
          # Sign the APK
          sed -i 's|package/signed=false|package/signed=true|g' "$CFG"
          # Set export output path (absolute)
          sed -i 's|export_path=""|export_path="/tmp/apk-out/diep-clone.apk"|g' "$CFG"
          echo "Patched export_presets.cfg:"
          grep -E "export_path|keystore/debug|signed" "$CFG"

      - name: Export Godot project to APK
        run: |
          GODOT="/tmp/gbin/Godot_v4.3-stable_linux.x86_64"
          PROJECT_PATH="$(pwd)/godot"
          "$GODOT" --headless --verbose \
            --path "$PROJECT_PATH" \
            --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk \
            2>&1 | tee /tmp/export.log || true
          echo "=== APK output directory ==="
          ls -lh /tmp/apk-out/ || echo "Directory empty"

      - name: Show export log on failure
        if: always()
        run: |
          echo "=== Relevant export log lines ==="
          grep -iE "error|warn|fail|export|apk|keystore|android" /tmp/export.log 2>/dev/null | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/diep-clone.apk
          if-no-files-found: warn
          retention-days: 30
