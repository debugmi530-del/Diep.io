name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O /tmp/templates.tpz
          cd /tmp && unzip -q templates.tpz
          mv /tmp/templates/* "$TEMPLATES_DIR/"
          echo "Templates: $(ls $TEMPLATES_DIR | grep android)"

      - name: Install Android build-tools 34
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
          echo "Build tools: $(ls $ANDROID_HOME/build-tools/)"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore OK"

      - name: Write minimal export preset
        run: |
          PRESET_FILE="godot/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"
          echo '[preset.0]'                                         >  "$PRESET_FILE"
          echo ''                                                   >> "$PRESET_FILE"
          echo 'name="Android Debug"'                              >> "$PRESET_FILE"
          echo 'platform="Android"'                                >> "$PRESET_FILE"
          echo 'runnable=true'                                      >> "$PRESET_FILE"
          echo 'export_filter="all_resources"'                     >> "$PRESET_FILE"
          echo ''                                                   >> "$PRESET_FILE"
          echo '[preset.0.options]'                                 >> "$PRESET_FILE"
          echo ''                                                   >> "$PRESET_FILE"
          echo 'gradle_build/use_gradle_build=false'               >> "$PRESET_FILE"
          echo 'architectures/arm64-v8a=true'                      >> "$PRESET_FILE"
          echo "keystore/debug=\"$KEYSTORE\""                      >> "$PRESET_FILE"
          echo 'keystore/debug_user="androiddebugkey"'             >> "$PRESET_FILE"
          echo 'keystore/debug_password="android"'                 >> "$PRESET_FILE"
          echo 'package/unique_name="com.debugmi530.diepclone"'   >> "$PRESET_FILE"
          echo 'package/name="Diep.io Clone"'                      >> "$PRESET_FILE"
          echo 'package/signed=true'                               >> "$PRESET_FILE"
          echo 'package/classify_as_game=true'                     >> "$PRESET_FILE"
          echo 'permissions/internet=true'                         >> "$PRESET_FILE"
          echo 'permissions/access_network_state=true'             >> "$PRESET_FILE"
          echo 'permissions/access_wifi_state=true'                >> "$PRESET_FILE"
          echo ''                                                   >> "$PRESET_FILE"
          echo '=== Minimal preset ==='
          cat "$PRESET_FILE"

      - name: Write editor settings and export
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p ~/.config/godot
          SF="$HOME/.config/godot/editor_settings-4.tres"
          echo '[gd_resource type="EditorSettings" format=3]'                       > "$SF"
          echo ''                                                                   >> "$SF"
          echo '[resource]'                                                         >> "$SF"
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\""              >> "$SF"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$SF"
          echo 'export/android/debug_keystore_user = "androiddebugkey"'            >> "$SF"
          echo 'export/android/debug_keystore_pass = "android"'                    >> "$SF"
          echo "export/android/java_sdk_path = \"$JAVA_PATH\""                    >> "$SF"
          echo '=== Editor settings ==='
          cat "$SF"
          mkdir -p /tmp/apk-out
          cd godot
          echo '=== Running export ==='
          godot --headless --verbose --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk 2>&1
          echo "=== Exit: $? ==="

      - name: Verify APK
        run: |
          ls -lh /tmp/apk-out/ || echo "(empty)"
          test -f /tmp/apk-out/diep-clone.apk || (echo "APK missing!" && exit 1)
          echo "APK OK: $(du -h /tmp/apk-out/diep-clone.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/diep-clone.apk
          retention-days: 30
