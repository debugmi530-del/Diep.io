name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;23.2.8568313" "build-tools;34.0.0" "platforms;android-34"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Download Godot 4.3
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -O /tmp/godot.zip
          cd /tmp && unzip -q godot.zip
          mv "/tmp/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O /tmp/templates.tpz
          cd /tmp && unzip -q templates.tpz
          mv /tmp/templates/* "$TEMPLATES_DIR/"
          ls "$TEMPLATES_DIR/" | grep android

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore: $(ls -lh ~/.android/debug.keystore)"

      - name: Write Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          SF="$HOME/.config/godot/editor_settings-4.tres"
          echo '[gd_resource type="EditorSettings" format=3]'  > "$SF"
          echo ''                                              >> "$SF"
          echo '[resource]'                                    >> "$SF"
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\""                >> "$SF"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""  >> "$SF"
          echo 'export/android/debug_keystore_user = "androiddebugkey"'             >> "$SF"
          echo 'export/android/debug_keystore_pass = "android"'                     >> "$SF"
          echo "=== Editor settings ==="
          cat "$SF"

      - name: Patch keystore paths in export_presets.cfg
        run: |
          PRESET="godot/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" "$PRESET"
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' "$PRESET"
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' "$PRESET"
          sed -i 's|package/signed=false|package/signed=true|g' "$PRESET"
          echo "=== Preset keystore lines ==="
          grep -E "keystore|signed" "$PRESET"

      - name: Import project resources
        run: |
          cd godot
          timeout 90 godot --headless --import 2>&1 | tail -30 || true
          echo "Import done."

      - name: Export APK
        run: |
          mkdir -p /tmp/apk-out
          cd godot
          godot --headless --verbose --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk 2>&1
          echo "Exit: $?"

      - name: Verify and upload APK
        run: |
          ls -lh /tmp/apk-out/ || echo "dir empty"
          test -f /tmp/apk-out/diep-clone.apk || (echo "APK missing!" && exit 1)
          echo "APK OK: $(du -h /tmp/apk-out/diep-clone.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/diep-clone.apk
          retention-days: 30
