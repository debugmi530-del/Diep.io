name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33"
          ls "$ANDROID_HOME/build-tools/33.0.2/aapt2"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          ls -lh ~/.android/debug.keystore

      - name: Install Godot export templates
        run: |
          TDIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TDIR"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TDIR/"
          ls "$TDIR" | grep android

      - name: Install Godot headless
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/gbin
          chmod +x /tmp/gbin/Godot_v4.3-stable_linux.x86_64
          /tmp/gbin/Godot_v4.3-stable_linux.x86_64 --version

      - name: Write EditorSettings
        run: |
          mkdir -p "$HOME/.config/godot"
          SF="$HOME/.config/godot/editor_settings-4.tres"
          KEYSTORE="$HOME/.android/debug.keystore"
          JAVA_PATH="$(dirname $(dirname $(readlink -f $(which java))))"
          SDK="$ANDROID_HOME"
          BT="$(ls $SDK/build-tools/ | sort -V | tail -1)"
          echo '[gd_resource type="EditorSettings" format=3]' > "$SF"
          echo '' >> "$SF"
          echo '[resource]' >> "$SF"
          echo "export/android/android_sdk_path = \"$SDK\"" >> "$SF"
          echo "export/android/debug_keystore = \"$KEYSTORE\"" >> "$SF"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SF"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SF"
          echo "export/android/java_sdk_path = \"$JAVA_PATH\"" >> "$SF"
          echo "export/android/apksigner = \"$SDK/build-tools/$BT/apksigner\"" >> "$SF"
          echo "=== EditorSettings written ==="
          cat "$SF"

      - name: Patch export_presets.cfg
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" godot/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' godot/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' godot/export_presets.cfg
          sed -i 's|package/signed=false|package/signed=true|g' godot/export_presets.cfg
          sed -i 's|export_path=""|export_path="diep-clone.apk"|g' godot/export_presets.cfg
          grep -E "export_path|keystore/debug|signed" godot/export_presets.cfg

      - name: Export Godot project
        run: |
          mkdir -p /tmp/apk-out
          GODOT="/tmp/gbin/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" --headless --verbose \
            --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk \
            2>&1 | tee /tmp/export.log || true
          echo "=== APK output ==="
          ls -lh /tmp/apk-out/ || true

      - name: Dump diagnostics
        if: always()
        run: |
          echo "=== EditorSettings after export ==="
          cat "$HOME/.config/godot/editor_settings-4.tres" 2>/dev/null || echo "NOT FOUND"
          echo "=== Export log relevant lines ==="
          grep -v "^Godot\|framebuffer\|stb_\|renderer\|gl_\|driver\|radiance\|^$\|audio\|Display\|video" \
            /tmp/export.log 2>/dev/null | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/*.apk
          if-no-files-found: warn
          retention-days: 30
