name: Build Godot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Verify Godot and templates
        run: |
          godot --version
          echo "Templates dir:"
          ls ~/.local/share/godot/export_templates/ 2>/dev/null || echo "(no templates dir)"
          ls ~/.local/share/godot/export_templates/*/ 2>/dev/null | grep android || echo "(no android templates found in any dir)"
          echo "Android SDK:"
          ls /usr/lib/android-sdk/ 2>/dev/null || ls $ANDROID_HOME/ 2>/dev/null || echo "(SDK not found)"

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "Keystore: $(ls -lh ~/.android/debug.keystore)"

      - name: Write Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          SF="$HOME/.config/godot/editor_settings-4.tres"
          SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo '[gd_resource type="EditorSettings" format=3]'                      >  "$SF"
          echo ''                                                                   >> "$SF"
          echo '[resource]'                                                         >> "$SF"
          echo "export/android/android_sdk_path = \"$SDK_PATH\""                   >> "$SF"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$SF"
          echo 'export/android/debug_keystore_user = "androiddebugkey"'            >> "$SF"
          echo 'export/android/debug_keystore_pass = "android"'                    >> "$SF"
          echo "=== Editor settings ==="
          cat "$SF"

      - name: Patch keystore in export_presets.cfg
        run: |
          PRESET="godot/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" "$PRESET"
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' "$PRESET"
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' "$PRESET"
          sed -i 's|package/signed=false|package/signed=true|g' "$PRESET"
          grep -E "keystore|signed" "$PRESET"

      - name: Import project resources
        run: |
          cd godot
          timeout 120 godot --headless --import 2>&1 | tail -20 || true
          echo "Import done."

      - name: Export APK
        run: |
          mkdir -p /tmp/apk-out
          cd godot
          godot --headless --verbose --export-debug "Android Debug" /tmp/apk-out/diep-clone.apk 2>&1
          echo "Exit: $?"

      - name: Verify APK
        run: |
          ls -lh /tmp/apk-out/ || echo "(empty)"
          test -f /tmp/apk-out/diep-clone.apk || (echo "APK missing!" && exit 1)
          echo "APK OK: $(du -h /tmp/apk-out/diep-clone.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: diep-clone-apk
          path: /tmp/apk-out/diep-clone.apk
          retention-days: 30
