<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Diep.io Clone</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }
      #error-box {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #111;
        color: #f55;
        font-family: monospace;
        font-size: 13px;
        padding: 20px;
        overflow: auto;
        z-index: 99999;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
    <script>
      (function(){
        if(navigator.maxTouchPoints>0||'ontouchstart' in window){
          var _mm=window.matchMedia.bind(window);
          window.matchMedia=function(q){
            if(q==='(pointer: coarse)'){
              return {matches:true,media:q,onchange:null,
                addListener:function(){},removeListener:function(){},
                addEventListener:function(){},removeEventListener:function(){},
                dispatchEvent:function(){return false;}};
            }
            return _mm(q);
          };
        }
      })();

      window.onerror = function(msg, src, line, col, err) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'ОШИБКА:\n' + msg + '\n\nФайл: ' + src + '\nСтрока: ' + line + ':' + col + '\n\n' + (err ? err.stack : '');
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = (box.textContent || '') + '\nPromise error:\n' + (e.reason ? (e.reason.stack || e.reason) : e);
        }
      });
    </script>
  </head>
  <body>
    <div id="error-box"></div>
    <div id="root"></div>

    <!-- Резервные имена (не редактировать) -->
    <script src="./names.fallback.js"></script>

    <!-- Перехват ошибок names.js -->
    <script>
      (function () {
        var _prevOnerror = window.onerror;
        window._namesError = null;
        window.onerror = function (msg, src, line, col, err) {
          if (src && src.indexOf('names.js') !== -1) {
            window._namesError = { msg: msg, line: line, col: col };
            return true;
          }
          if (_prevOnerror) return _prevOnerror(msg, src, line, col, err);
          return false;
        };
      })();
    </script>

    <!-- Имена ботов — редактируй этот файл -->
    <script src="./names.js"></script>

    <!-- Валидация и выбор источника имён -->
    <script>
      (function () {
        var STORAGE_KEY = 'diep_bot_names_backup';
        var err = window._namesError;
        var names = window.BOT_NAMES;
        var fallback = window.BOT_NAMES_FALLBACK;

        function showPopup(source, errInfo) {
          function render() {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100000;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:#1a1a2e;border:2px solid #e74c3c;border-radius:12px;padding:28px 32px;max-width:500px;width:90%;color:#fff;font-family:monospace;font-size:14px;line-height:1.6;box-shadow:0 0 50px rgba(231,76,60,0.35);';
            var errHtml = errInfo
              ? '<div style="margin:10px 0;padding:10px;background:#2a0a0a;border-radius:6px;color:#ff8080;">'
                + 'Строка ' + errInfo.line + ', позиция ' + errInfo.col + ':<br>'
                + errInfo.msg
                + '</div>'
              : '';
            box.innerHTML =
              '<div style="color:#e74c3c;font-size:17px;margin-bottom:10px;">⚠️ Ошибка в файле names.js</div>'
              + errHtml
              + '<div style="color:#aaa;margin-top:8px;">Игра запущена с именами из:<br><b style="color:#3498db;">'
              + source + '</b></div>'
              + '<button id="_names_ok" style="margin-top:20px;background:#e74c3c;border:none;color:#fff;'
              + 'padding:9px 28px;border-radius:6px;cursor:pointer;font-size:14px;font-family:monospace;">'
              + 'Понятно</button>';
            overlay.appendChild(box);
            document.body.appendChild(overlay);
            document.getElementById('_names_ok').onclick = function () { overlay.remove(); };
          }
          if (document.body) render();
          else document.addEventListener('DOMContentLoaded', render);
        }

        var valid = Array.isArray(names) && names.length > 0;

        if (!err && valid) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch (e) {}
          window._GAME_BOT_NAMES = names;
          return;
        }

        // Попытка 1: localStorage
        var lsBackup = null;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) lsBackup = JSON.parse(raw);
        } catch (e) {}

        if (lsBackup && lsBackup.length > 0) {
          window._GAME_BOT_NAMES = lsBackup;
          showPopup('резервной копии браузера', err);
          return;
        }

        // Попытка 2: names.fallback.js
        if (Array.isArray(fallback) && fallback.length > 0) {
          window._GAME_BOT_NAMES = fallback;
          showPopup('names.fallback.js', err);
          return;
        }

        // Попытка 3: встроенные имена в game.js (window._GAME_BOT_NAMES остаётся null)
        window._GAME_BOT_NAMES = null;
        showPopup('встроенного списка игры', err);
      })();
    </script>

    <script src="./game.js"></script>

    <!-- Admin Panel -->
    <script>
    (function() {
      var SHAPES = [
        { type: 'square',          label: 'Квадрат' },
        { type: 'triangle',        label: 'Треугольник' },
        { type: 'mediumSquare',    label: 'Средний квадрат' },
        { type: 'largeSquare',     label: 'Большой квадрат' },
        { type: 'mediumTriangle',  label: 'Средний треугольник' },
        { type: 'largeTriangle',   label: 'Гигантский треугольник' },
        { type: 'pentagon',        label: 'Пятиугольник' },
        { type: 'crasher',         label: 'Крашер' },
        { type: 'bigPentagon',     label: 'Большой пятиугольник' },
        { type: 'alphaPentagon',   label: 'Альфа пятиугольник' },
        { type: 'hexagon',         label: 'Шестиугольник' },
        { type: 'heptagon',        label: 'Семиугольник' },
        { type: 'octagon',         label: 'Восьмиугольник' },
        { type: 'decagon',         label: 'Десятиугольник' },
        { type: 'megaPentagon',    label: 'Мега пятиугольник' },
        { type: 'ultraPolygon',    label: 'Ультра полигон' }
      ];

      var COLORS = {
        square:'#f0dc40', triangle:'#f05050', mediumSquare:'#00ddcc',
        largeSquare:'#ff8800', mediumTriangle:'#ffcc00', largeTriangle:'#44cc44',
        pentagon:'#6088ff', crasher:'#ff66aa', bigPentagon:'#4466ff',
        alphaPentagon:'#aa44ff', hexagon:'#22ccaa', heptagon:'#ff4488',
        octagon:'#ff6622', decagon:'#aa2222', megaPentagon:'#2244cc',
        ultraPolygon:'#cc00ff'
      };

      window._adminSpawnQueue = window._adminSpawnQueue || [];

      function init() {
        var style = document.createElement('style');
        style.textContent = [
          '#_adm-btn{position:fixed;bottom:14px;left:14px;z-index:9000;',
          'background:rgba(20,20,35,0.92);border:1.5px solid rgba(255,255,255,0.18);',
          'color:#fff;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;',
          'padding:5px 10px;border-radius:6px;cursor:pointer;letter-spacing:.5px;',
          'backdrop-filter:blur(4px);transition:background .15s;}',
          '#_adm-btn:hover{background:rgba(40,40,70,0.97);}',
          '#_adm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;',
          'z-index:8999;background:rgba(0,0,0,0.35);}',
          '#_adm-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);',
          'z-index:9001;background:rgba(15,15,28,0.97);border:1.5px solid rgba(255,255,255,0.15);',
          'border-radius:12px;padding:18px 20px 16px;min-width:320px;max-width:94vw;',
          'backdrop-filter:blur(8px);box-shadow:0 8px 40px rgba(0,0,0,0.7);',
          'font-family:Arial,sans-serif;display:none;}',
          '#_adm-panel h3{margin:0 0 12px;color:#c8a018;font-size:13px;letter-spacing:.6px;',
          'text-align:center;text-transform:uppercase;}',
          '#_adm-close{position:absolute;top:10px;right:12px;background:none;border:none;',
          'color:rgba(255,255,255,0.5);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px;}',
          '#_adm-close:hover{color:#fff;}',
          '#_adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}',
          '._adm-shape{border:none;border-radius:7px;padding:7px 8px;cursor:pointer;',
          'font-family:Arial,sans-serif;font-size:11px;font-weight:bold;',
          'color:#111;text-align:left;transition:opacity .12s,transform .1s;}',
          '._adm-shape:hover{opacity:.85;transform:scale(1.04);}',
          '._adm-shape:active{transform:scale(.97);}',
          '#_adm-status{margin-top:10px;text-align:center;color:rgba(255,255,255,0.45);',
          'font-size:10px;min-height:14px;}'
        ].join('');
        document.head.appendChild(style);

        var btn = document.createElement('button');
        btn.id = '_adm-btn';
        btn.textContent = '⚙ Админ';
        document.body.appendChild(btn);

        var overlay = document.createElement('div');
        overlay.id = '_adm-overlay';
        document.body.appendChild(overlay);

        var panel = document.createElement('div');
        panel.id = '_adm-panel';
        panel.innerHTML = '<h3>Спавн фигур</h3>'
          + '<button id="_adm-close" title="Закрыть">✕</button>'
          + '<div id="_adm-grid"></div>'
          + '<div id="_adm-status">Нажмите на фигуру чтобы заспавнить рядом с вами</div>';
        document.body.appendChild(panel);

        var grid = document.getElementById('_adm-grid');
        SHAPES.forEach(function(s) {
          var b = document.createElement('button');
          b.className = '_adm-shape';
          b.style.background = COLORS[s.type] || '#888';
          b.textContent = s.label;
          b.addEventListener('click', function() {
            window._adminSpawnQueue = window._adminSpawnQueue || [];
            window._adminSpawnQueue.push(s.type);
            var st = document.getElementById('_adm-status');
            if (st) { st.style.color = '#6ef'; st.textContent = 'Заспавнено: ' + s.label; setTimeout(function(){ st.style.color='rgba(255,255,255,0.45)'; st.textContent='Нажмите на фигуру чтобы заспавнить рядом с вами'; }, 1500); }
          });
          grid.appendChild(b);
        });

        function openPanel() { panel.style.display = 'block'; overlay.style.display = 'block'; }
        function closePanel() { panel.style.display = 'none'; overlay.style.display = 'none'; }

        btn.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        document.getElementById('_adm-close').addEventListener('click', closePanel);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
      }

      if (document.body) init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
  </body>
</html>
