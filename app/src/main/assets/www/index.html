<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Diep.io Clone</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }
      #error-box {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #111;
        color: #f55;
        font-family: monospace;
        font-size: 13px;
        padding: 20px;
        overflow: auto;
        z-index: 99999;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
    <script>
      (function(){
        if(navigator.maxTouchPoints>0||'ontouchstart' in window){
          var _mm=window.matchMedia.bind(window);
          window.matchMedia=function(q){
            if(q==='(pointer: coarse)'){
              return {matches:true,media:q,onchange:null,
                addListener:function(){},removeListener:function(){},
                addEventListener:function(){},removeEventListener:function(){},
                dispatchEvent:function(){return false;}};
            }
            return _mm(q);
          };
        }
      })();

      window.onerror = function(msg, src, line, col, err) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'ОШИБКА:\n' + msg + '\n\nФайл: ' + src + '\nСтрока: ' + line + ':' + col + '\n\n' + (err ? err.stack : '');
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = (box.textContent || '') + '\nPromise error:\n' + (e.reason ? (e.reason.stack || e.reason) : e);
        }
      });
    </script>
  </head>
  <body>
    <div id="error-box"></div>
    <div id="root"></div>

    <!-- Резервные имена (не редактировать) -->
    <script src="./names.fallback.js"></script>

    <!-- Перехват ошибок names.js -->
    <script>
      (function () {
        var _prevOnerror = window.onerror;
        window._namesError = null;
        window.onerror = function (msg, src, line, col, err) {
          if (src && src.indexOf('names.js') !== -1) {
            window._namesError = { msg: msg, line: line, col: col };
            return true;
          }
          if (_prevOnerror) return _prevOnerror(msg, src, line, col, err);
          return false;
        };
      })();
    </script>

    <!-- Имена ботов — редактируй этот файл -->
    <script src="./names.js"></script>

    <!-- Валидация и выбор источника имён -->
    <script>
      (function () {
        var STORAGE_KEY = 'diep_bot_names_backup';
        var err = window._namesError;
        var names = window.BOT_NAMES;
        var fallback = window.BOT_NAMES_FALLBACK;

        function showPopup(source, errInfo) {
          function render() {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100000;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:#1a1a2e;border:2px solid #e74c3c;border-radius:12px;padding:28px 32px;max-width:500px;width:90%;color:#fff;font-family:monospace;font-size:14px;line-height:1.6;box-shadow:0 0 50px rgba(231,76,60,0.35);';
            var errHtml = errInfo
              ? '<div style="margin:10px 0;padding:10px;background:#2a0a0a;border-radius:6px;color:#ff8080;">'
                + 'Строка ' + errInfo.line + ', позиция ' + errInfo.col + ':<br>'
                + errInfo.msg
                + '</div>'
              : '';
            box.innerHTML =
              '<div style="color:#e74c3c;font-size:17px;margin-bottom:10px;">&#9888;&#65039; Ошибка в файле names.js</div>'
              + errHtml
              + '<div style="color:#aaa;margin-top:8px;">Игра запущена с именами из:<br><b style="color:#3498db;">'
              + source + '</b></div>'
              + '<button id="_names_ok" style="margin-top:20px;background:#e74c3c;border:none;color:#fff;'
              + 'padding:9px 28px;border-radius:6px;cursor:pointer;font-size:14px;font-family:monospace;">'
              + 'Понятно</button>';
            overlay.appendChild(box);
            document.body.appendChild(overlay);
            document.getElementById('_names_ok').onclick = function () { overlay.remove(); };
          }
          if (document.body) render();
          else document.addEventListener('DOMContentLoaded', render);
        }

        var valid = Array.isArray(names) && names.length > 0;

        if (!err && valid) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch (e) {}
          window._GAME_BOT_NAMES = names;
          return;
        }

        var lsBackup = null;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) lsBackup = JSON.parse(raw);
        } catch (e) {}

        if (lsBackup && lsBackup.length > 0) {
          window._GAME_BOT_NAMES = lsBackup;
          showPopup('резервной копии браузера', err);
          return;
        }

        if (Array.isArray(fallback) && fallback.length > 0) {
          window._GAME_BOT_NAMES = fallback;
          showPopup('names.fallback.js', err);
          return;
        }

        window._GAME_BOT_NAMES = null;
        showPopup('встроенного списка игры', err);
      })();
    </script>

        function darken(hex, amt) {
          var r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
          var g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
          var b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
          return '#' + [r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
        }

        function buildTankTree(nodes, parentColor) {
          nodes.forEach(function(node) {
            var col = node.color || parentColor || '#888';
            var darkCol = darken(col, 40);
            var wrap = document.createElement('div');
            wrap.className = '_adm-branch';
            wrap.style.borderColor = col + '44';

            /* header row */
            var hd = document.createElement('div');
            hd.className = '_adm-branch-hd';
            hd.style.background = darkCol + 'cc';

            var dot = document.createElement('span');
            dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:' + col + ';flex-shrink:0;';
            hd.appendChild(dot);

            var nameEl = document.createElement('span');
            nameEl.className = '_adm-branch-name';
            nameEl.textContent = node.branch;
            hd.appendChild(nameEl);

            if (node.badge) {
              var badge = document.createElement('span');
              badge.className = '_adm-badge';
              badge.textContent = node.badge;
              hd.appendChild(badge);
            }

            var lvl = node.tier === 1 ? 1 : node.tier === 2 ? 15 : 30;
            var spawnBtn = document.createElement('button');
            spawnBtn.className = '_adm-spawn-btn';
            spawnBtn.style.background = col;
            spawnBtn.textContent = '▶ NPC';
            spawnBtn.title = 'Заспавнить NPC ' + node.branch + ' (Lv' + lvl + ')';
            spawnBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              spawnNpc(node.branch, lvl, node.branch);
            });
            hd.appendChild(spawnBtn);
            wrap.appendChild(hd);

            if (node.desc) {
              var descEl = document.createElement('div');
              descEl.className = '_adm-branch-desc';
              descEl.textContent = node.desc;
              wrap.appendChild(descEl);
            }

            /* T3 children with T4 buttons */
            if (node.children && node.children.length) {
              var childWrap = document.createElement('div');
              childWrap.className = '_adm-children';

              if (node.children[0].t4) {
                /* These ARE T3 nodes */
                node.children.forEach(function(t3) {
                  var row = document.createElement('div');
                  row.className = '_adm-t3-row';
                  row.style.borderLeft = '3px solid ' + (t3.color || col);

                  var info = document.createElement('div');
                  info.className = '_adm-t3-info';

                  var nameRow = document.createElement('div');
                  nameRow.style.cssText = 'display:flex;align-items:center;gap:6px;';

                  var t3name = document.createElement('span');
                  t3name.className = '_adm-t3-name';
                  t3name.textContent = t3.branch;
                  nameRow.appendChild(t3name);

                  var t3spawn = document.createElement('button');
                  t3spawn.className = '_adm-spawn-btn';
                  t3spawn.style.background = t3.color || col;
                  t3spawn.textContent = '▶ NPC';
                  t3spawn.addEventListener('click', function() {
                    spawnNpc(t3.branch, 30, t3.branch);
                  });
                  nameRow.appendChild(t3spawn);
                  info.appendChild(nameRow);

                  if (t3.desc) {
                    var t3desc = document.createElement('div');
                    t3desc.className = '_adm-t3-desc';
                    t3desc.textContent = t3.desc;
                    info.appendChild(t3desc);
                  }

                  /* T4 variant buttons */
                  if (t3.t4 && t3.t4.length) {
                    var t4wrap = document.createElement('div');
                    t4wrap.className = '_adm-t4s';
                    t3.t4.forEach(function(v) {
                      var vbtn = document.createElement('button');
                      vbtn.className = '_adm-t4-btn';
                      vbtn.textContent = v.label;
                      vbtn.title = v.name + ': ' + v.desc;
                      vbtn.addEventListener('click', function() {
                        spawnNpc(v.name, 45, v.label + ' ' + t3.branch);
                      });
                      t4wrap.appendChild(vbtn);
                    });
                    info.appendChild(t4wrap);
                  }

                  row.appendChild(info);
                  childWrap.appendChild(row);
                });
                wrap.appendChild(childWrap);
              } else {
                /* These are T2 branches — recurse */
                buildTankTree(node.children, col);
                node.children.forEach(function(child) {
                  childWrap.appendChild(child._el);
                });
                wrap.appendChild(childWrap);
              }
            }

            node._el = wrap;
            tanksPane.appendChild(wrap);
          });
        }

        /* flatten Basic > T2 > T3 structure for display */
        var basicNode = TANK_TREE[0];
        basicNode.children.forEach(function(t2node) {
          buildTankTree([t2node], basicNode.color);
        });

        /* ── TABS ─── */
        var tabs = panel.querySelectorAll('._adm-tab');
        tabs.forEach(function(tab) {
          tab.addEventListener('click', function() {
            tabs.forEach(function(t){ t.classList.remove('active'); });
            tab.classList.add('active');
            var which = tab.getAttribute('data-tab');
            document.getElementById('_adm-pane-shapes').style.display = which==='shapes' ? '' : 'none';
            document.getElementById('_adm-pane-tanks').style.display  = which==='tanks'  ? '' : 'none';
          });
        });

        /* ── OPEN / CLOSE ─── */
        function openPanel()  { panel.style.display = 'flex'; overlay.style.display = 'block'; }
        function closePanel() { panel.style.display = 'none';  overlay.style.display = 'none'; }

        btn.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        document.getElementById('_adm-close').addEventListener('click', closePanel);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
      }

      if (document.body) init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
  </body>
</html>
