<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Diep.io Clone</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }
      #error-box {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #111;
        color: #f55;
        font-family: monospace;
        font-size: 13px;
        padding: 20px;
        overflow: auto;
        z-index: 99999;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
    <script>
      (function(){
        if(navigator.maxTouchPoints>0||'ontouchstart' in window){
          var _mm=window.matchMedia.bind(window);
          window.matchMedia=function(q){
            if(q==='(pointer: coarse)'){
              return {matches:true,media:q,onchange:null,
                addListener:function(){},removeListener:function(){},
                addEventListener:function(){},removeEventListener:function(){},
                dispatchEvent:function(){return false;}};
            }
            return _mm(q);
          };
        }
      })();

      window.onerror = function(msg, src, line, col, err) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'ОШИБКА:\n' + msg + '\n\nФайл: ' + src + '\nСтрока: ' + line + ':' + col + '\n\n' + (err ? err.stack : '');
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('error-box');
        if (box) {
          box.style.display = 'block';
          box.textContent = (box.textContent || '') + '\nPromise error:\n' + (e.reason ? (e.reason.stack || e.reason) : e);
        }
      });
    </script>
  </head>
  <body>
    <div id="error-box"></div>
    <div id="root"></div>

    <!-- Резервные имена (не редактировать) -->
    <script src="./names.fallback.js"></script>

    <!-- Перехват ошибок names.js -->
    <script>
      (function () {
        var _prevOnerror = window.onerror;
        window._namesError = null;
        window.onerror = function (msg, src, line, col, err) {
          if (src && src.indexOf('names.js') !== -1) {
            window._namesError = { msg: msg, line: line, col: col };
            return true;
          }
          if (_prevOnerror) return _prevOnerror(msg, src, line, col, err);
          return false;
        };
      })();
    </script>

    <!-- Имена ботов — редактируй этот файл -->
    <script src="./names.js"></script>

    <!-- Валидация и выбор источника имён -->
    <script>
      (function () {
        // Пользовательские имена имеют наивысший приоритет
        var _customRaw = null;
        try { _customRaw = localStorage.getItem('diep_bot_names_custom'); } catch(e) {}
        if (_customRaw) {
          var _customParsed = null;
          try { _customParsed = JSON.parse(_customRaw); } catch(e) {}
          if (Array.isArray(_customParsed) && _customParsed.length > 0) {
            window._GAME_BOT_NAMES = _customParsed;
            return;
          }
        }
        var STORAGE_KEY = 'diep_bot_names_backup';
        var err = window._namesError;
        var names = window.BOT_NAMES;
        var fallback = window.BOT_NAMES_FALLBACK;

        function showPopup(source, errInfo) {
          function render() {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100000;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:#1a1a2e;border:2px solid #e74c3c;border-radius:12px;padding:28px 32px;max-width:500px;width:90%;color:#fff;font-family:monospace;font-size:14px;line-height:1.6;box-shadow:0 0 50px rgba(231,76,60,0.35);';
            var errHtml = errInfo
              ? '<div style="margin:10px 0;padding:10px;background:#2a0a0a;border-radius:6px;color:#ff8080;">'
                + 'Строка ' + errInfo.line + ', позиция ' + errInfo.col + ':<br>'
                + errInfo.msg
                + '</div>'
              : '';
            box.innerHTML =
              '<div style="color:#e74c3c;font-size:17px;margin-bottom:10px;">&#9888;&#65039; Ошибка в файле names.js</div>'
              + errHtml
              + '<div style="color:#aaa;margin-top:8px;">Игра запущена с именами из:<br><b style="color:#3498db;">'
              + source + '</b></div>'
              + '<button id="_names_ok" style="margin-top:20px;background:#e74c3c;border:none;color:#fff;'
              + 'padding:9px 28px;border-radius:6px;cursor:pointer;font-size:14px;font-family:monospace;">'
              + 'Понятно</button>';
            overlay.appendChild(box);
            document.body.appendChild(overlay);
            document.getElementById('_names_ok').onclick = function () { overlay.remove(); };
          }
          if (document.body) render();
          else document.addEventListener('DOMContentLoaded', render);
        }

        var valid = Array.isArray(names) && names.length > 0;

        if (!err && valid) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch (e) {}
          window._GAME_BOT_NAMES = names;
          return;
        }

        var lsBackup = null;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) lsBackup = JSON.parse(raw);
        } catch (e) {}

        if (lsBackup && lsBackup.length > 0) {
          window._GAME_BOT_NAMES = lsBackup;
          showPopup('резервной копии браузера', err);
          return;
        }

        if (Array.isArray(fallback) && fallback.length > 0) {
          window._GAME_BOT_NAMES = fallback;
          showPopup('names.fallback.js', err);
          return;
        }

        window._GAME_BOT_NAMES = null;
        showPopup('встроенного списка игры', err);
      })();
    </script>

    <script src="./game.js"></script>
    <script src="./tank-builder.js"></script>
    <script src="./multiplayer.js"></script>

    <!-- Конструктор — скрываем кнопку до ввода PIN -->
    <script>
    (function() {
      var BUILDER_TEXT = '⚙ Конструктор';
      /* Скрываем/показываем кнопку */
      function setBuilderBtnVisible(visible) {
        document.querySelectorAll('button').forEach(function(btn) {
          if (btn.textContent && btn.textContent.trim() === BUILDER_TEXT) {
            btn.style.display = visible ? '' : 'none';
          }
        });
      }
      /* Наблюдаем за добавлением новых кнопок */
      var _obs = new MutationObserver(function() {
        if (!window._builderUnlocked) setBuilderBtnVisible(false);
      });
      _obs.observe(document.body, { childList: true, subtree: true });
      /* После ввода PIN — показываем */
      window.addEventListener('builderUnlocked', function() {
        _obs.disconnect();
        setBuilderBtnVisible(true);
      });
    })();
    </script>

          '#_adm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;',
          'z-index:1802;background:rgba(0,0,0,0.4);}',

          'z-index:1903;background:rgba(13,13,24,0.98);border:1.5px solid rgba(255,255,255,0.13);',
          'border-radius:14px;padding:0;min-width:340px;max-width:96vw;max-height:88vh;',
          'display:none;flex-direction:column;',
          'backdrop-filter:blur(10px);box-shadow:0 10px 50px rgba(0,0,0,0.8);',
          'font-family:Arial,sans-serif;}',
          /* header */
          '#_adm-header{padding:14px 20px 0;flex-shrink:0;}',
          '#_adm-title{margin:0 0 10px;color:#c8a018;font-size:12px;letter-spacing:.8px;',
          'text-align:center;text-transform:uppercase;font-weight:bold;}',
          '#_adm-close{position:absolute;top:10px;right:12px;background:none;border:none;',
          'color:rgba(255,255,255,0.45);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:4px;}',

          /* tabs */
          '#_adm-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,0.1);',
          'padding:0 16px;}',
          '._adm-tab{flex:1;padding:7px 4px;background:none;border:none;',

          '._adm-tab.active{color:#c8a018;border-bottom-color:#c8a018;}',
          /* body */
          '#_adm-body{overflow-y:auto;padding:14px 16px;flex:1;min-height:0;}',
          /* shapes grid */
          '#_adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}',
          '._adm-shape{border:none;border-radius:7px;padding:7px 8px;cursor:pointer;',

          'color:#111;text-align:left;transition:opacity .12s,transform .1s;}',

          /* tank tree */

          '._adm-branch-hd{display:flex;align-items:center;gap:7px;padding:8px 11px;',

          '._adm-badge{font-size:8px;font-weight:bold;padding:2px 5px;border-radius:3px;',
          'background:#c8a018;color:#111;letter-spacing:.5px;}',
          '._adm-branch-desc{font-size:10px;color:rgba(255,255,255,0.5);line-height:1.4;',
          'padding:0 11px 6px;margin-top:-2px;}',
          '._adm-spawn-btn{border:none;border-radius:5px;padding:4px 9px;',
          'font-family:Arial,sans-serif;font-size:10px;font-weight:bold;',
          'cursor:pointer;color:#111;white-space:nowrap;transition:opacity .12s,transform .1s;flex-shrink:0;}',
          '._adm-spawn-btn:hover{opacity:.82;transform:scale(1.05);}',
          '._adm-spawn-btn:active{transform:scale(.96);}',
          '._adm-children{padding:6px 8px 8px;display:flex;flex-direction:column;gap:5px;',
          'background:rgba(0,0,0,0.25);}',
          '._adm-t3-row{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;',
          'border-radius:7px;background:rgba(255,255,255,0.04);}',
          '._adm-t3-info{flex:1;min-width:0;}',
          '._adm-t3-name{font-size:11px;font-weight:bold;color:#eee;}',
          '._adm-t3-desc{font-size:9px;color:rgba(255,255,255,0.42);margin-top:2px;line-height:1.3;}',
          '._adm-t4s{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}',
          '._adm-t4-btn{border:none;border-radius:4px;padding:3px 7px;',

          'transition:opacity .12s,transform .1s;white-space:nowrap;}',
          '._adm-t4-btn:hover{opacity:.82;transform:scale(1.06);}',

          /* status */

          'border-top:1px solid rgba(255,255,255,0.07);}'
        ].join('');
        document.head.appendChild(style);

        /* toggle button */
        var btn = document.createElement('button');
        btn.id = '_adm-btn';
        btn.textContent = '⚙ Админ';
        btn.style.display = 'none';
        document.body.appendChild(btn);

        // Admin button permanently hidden (code preserved, button invisible)
        // setInterval removed — display stays 'none' always

        /* overlay */

        overlay.id = '_adm-overlay';
        document.body.appendChild(overlay);

            '</div>' +
          '</div>' +
          '<div id="_adm-body">' +
            '<div id="_adm-pane-shapes">' +
              '<div id="_adm-grid"></div>' +
            '</div>' +
            '<div id="_adm-pane-tanks" style="display:none;"></div>' +
          '</div>' +
          '<div id="_adm-status">Нажмите кнопку для действия</div>';
        document.body.appendChild(panel);

        /* ── STATUS helper ─── */
        function setStatus(msg, color) {
          var st = document.getElementById('_adm-status');
          if (!st) return;
          st.style.color = color || '#6ef';
          st.textContent = msg;
          setTimeout(function() {
            st.style.color = 'rgba(255,255,255,0.38)';
            st.textContent = 'Нажмите кнопку для действия';
          }, 1800);
        }

        /* ── CONTENT BUILD (lazy — runs only on first open) ─── */
        var _contentBuilt = false;

        function buildContent() {
          if (_contentBuilt) return;
          _contentBuilt = true;

          /* ── SHAPES TAB ─── */
          var grid = document.getElementById('_adm-grid');
          SHAPES.forEach(function(s) {
            var b = document.createElement('button');
            b.className = '_adm-shape';
            b.style.background = SHAPE_COLORS[s.type] || '#888';
            b.textContent = s.label;
            b.addEventListener('click', function() {
              window._adminSpawnQueue = window._adminSpawnQueue || [];
              window._adminSpawnQueue.push(s.type);
              setStatus('Заспавнено: ' + s.label);
            });
            grid.appendChild(b);
          });

          /* ── TANKS TAB ─── */
          var tanksPane = document.getElementById('_adm-pane-tanks');

          function spawnNpc(className, level, label) {
            window._adminNpcQueue = window._adminNpcQueue || [];
            window._adminNpcQueue.push({ className: className, level: level || 45 });
            setStatus('Спавн NPC: ' + (label || className) + ' (Lv' + (level||45) + ')');
          }

          function darken(hex, amt) {
            var r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
            var g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
            var b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
            return '#' + [r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
          }

          function buildTankTree(nodes, parentColor) {
            nodes.forEach(function(node) {
              var col = node.color || parentColor || '#888';
              var darkCol = darken(col, 40);
              var wrap = document.createElement('div');
              wrap.className = '_adm-branch';
              wrap.style.borderColor = col + '44';

              var hd = document.createElement('div');
              hd.className = '_adm-branch-hd';
              hd.style.background = darkCol + 'cc';

              var dot = document.createElement('span');
              dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:' + col + ';flex-shrink:0;';
              hd.appendChild(dot);

              var nameEl = document.createElement('span');
              nameEl.className = '_adm-branch-name';
              nameEl.textContent = node.branch;
              hd.appendChild(nameEl);

              if (node.badge) {
                var badge = document.createElement('span');
                badge.className = '_adm-badge';
                badge.textContent = node.badge;
                hd.appendChild(badge);
              }

              var lvl = node.tier === 1 ? 1 : node.tier === 2 ? 15 : 30;
              var spawnBtn = document.createElement('button');
              spawnBtn.className = '_adm-spawn-btn';
              spawnBtn.style.background = col;
              spawnBtn.textContent = '▶ NPC';
              spawnBtn.title = 'Заспавнить NPC ' + node.branch + ' (Lv' + lvl + ')';
              spawnBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                spawnNpc(node.branch, lvl, node.branch);
              });
              hd.appendChild(spawnBtn);
              wrap.appendChild(hd);

              if (node.desc) {
                var descEl = document.createElement('div');
                descEl.className = '_adm-branch-desc';
                descEl.textContent = node.desc;
                wrap.appendChild(descEl);
              }

              if (node.children && node.children.length) {
                var childWrap = document.createElement('div');
                childWrap.className = '_adm-children';

                buildTankTree(node.children, col);
                node.children.forEach(function(child) {
                  childWrap.appendChild(child._el);
                });
                wrap.appendChild(childWrap);
              }

              node._el = wrap;
              tanksPane.appendChild(wrap);
            });
          }

          // ── Custom NPC spawn (any tank) ──
          var customBlock = document.createElement('div');
          customBlock.style.cssText = 'background:rgba(30,30,60,0.9);border:1px solid rgba(100,150,255,0.3);border-radius:8px;padding:10px 12px;margin-bottom:12px;';

          var customTitle = document.createElement('div');
          customTitle.style.cssText = 'color:#aac8ff;font-size:12px;font-weight:bold;margin-bottom:8px;letter-spacing:.5px;';
          customTitle.textContent = '🎮 Призвать любого NPC';
          customBlock.appendChild(customTitle);

          var inputRow = document.createElement('div');
          inputRow.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px;';

          var classInput = document.createElement('input');
          classInput.type = 'text';
          classInput.placeholder = 'Класс танка (напр. Overlord)';
          classInput.style.cssText = 'flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:5px;color:#fff;padding:5px 8px;font-size:12px;outline:none;';
          inputRow.appendChild(classInput);

          var lvlInput = document.createElement('input');
          lvlInput.type = 'number';
          lvlInput.value = '45';
          lvlInput.min = '1'; lvlInput.max = '45';
          lvlInput.style.cssText = 'width:54px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:5px;color:#fff;padding:5px 6px;font-size:12px;outline:none;';
          inputRow.appendChild(lvlInput);

          var customBtn = document.createElement('button');
          customBtn.textContent = '▶ Спавн';
          customBtn.style.cssText = 'background:rgba(60,120,220,0.8);color:#fff;border:none;border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;';
          customBtn.addEventListener('click', function() {
            var cls = classInput.value.trim();
            if (!cls) { setStatus('Введи класс танка!', '#f88'); return; }
            spawnNpc(cls, parseInt(lvlInput.value)||45, cls);
          });
          inputRow.appendChild(customBtn);
          customBlock.appendChild(inputRow);

          var qtyRow = document.createElement('div');
          qtyRow.style.cssText = 'display:flex;gap:6px;align-items:center;';
          var qtyLabel = document.createElement('span');
          qtyLabel.style.cssText = 'color:rgba(255,255,255,0.5);font-size:11px;';
          qtyLabel.textContent = 'Кол-во:';
          qtyRow.appendChild(qtyLabel);
          [1,3,5,10].forEach(function(n) {
            var qb = document.createElement('button');
            qb.textContent = n;
            qb.style.cssText = 'background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;';
            qb.addEventListener('click', function() {
              var cls = classInput.value.trim();
              if (!cls) { setStatus('Введи класс танка!', '#f88'); return; }
              for(var _i=0;_i<n;_i++) {
                window._adminNpcQueue = window._adminNpcQueue || [];
                window._adminNpcQueue.push({ className: cls, level: parseInt(lvlInput.value)||45 });
              }
              setStatus('Спавн × ' + n + ': ' + cls, '#8f8');
            });
            qtyRow.appendChild(qb);
          });
          customBlock.appendChild(qtyRow);
          tanksPane.appendChild(customBlock);

          // ── Tank tree ──
          var basicNode = TANK_TREE[0];
          basicNode.children.forEach(function(t2node) {
            buildTankTree([t2node], basicNode.color);
          });
        }

        /* ── TABS ─── */
        var tabs = panel.querySelectorAll('._adm-tab');
        tabs.forEach(function(tab) {
          tab.addEventListener('click', function() {
            tabs.forEach(function(t){ t.classList.remove('active'); });
            tab.classList.add('active');
            var which = tab.getAttribute('data-tab');
            document.getElementById('_adm-pane-shapes').style.display = which==='shapes' ? '' : 'none';
            document.getElementById('_adm-pane-tanks').style.display  = which==='tanks'  ? '' : 'none';
          });
        });

        /* ── OPEN / CLOSE ─── */
        function openPanel()  { buildContent(); panel.style.display = 'flex'; overlay.style.display = 'block'; }
        function closePanel() { panel.style.display = 'none';  overlay.style.display = 'none'; }

        btn.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        document.getElementById('_adm-close').addEventListener('click', closePanel);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
      }

      if (document.body) init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
    <!-- Bot Names Editor -->
    <script>
    (function() {
      var CUSTOM_KEY = 'diep_bot_names_custom';
      var editingIdx = -1;

      function getDefaultNames() {
        var src = window.BOT_NAMES || window.BOT_NAMES_FALLBACK || [];
        return src.slice();
      }

      function loadNames() {
        try {
          var raw = localStorage.getItem(CUSTOM_KEY);
          if (raw) { var p = JSON.parse(raw); if (Array.isArray(p) && p.length > 0) return p; }
        } catch(e) {}
        return getDefaultNames();
      }

      function saveNames(arr) {
        try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr)); } catch(e) {}
        // Mutate global array in place so running game picks up changes immediately
        if (window._GAME_BOT_NAMES && Array.isArray(window._GAME_BOT_NAMES)) {
          window._GAME_BOT_NAMES.splice(0, window._GAME_BOT_NAMES.length);
          arr.forEach(function(n) { window._GAME_BOT_NAMES.push(n); });
        } else {
          window._GAME_BOT_NAMES = arr.slice();
        }
      }

      function init() {
        /* ── CSS ── */
        var style = document.createElement('style');
        style.textContent = [
          '#_nm-btn{position:fixed;bottom:14px;right:14px;z-index:400;',
          'background:rgba(20,20,35,0.92);border:1.5px solid rgba(100,180,255,0.35);',
          'color:#7ecfff;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;',
          'padding:7px 12px;border-radius:8px;cursor:pointer;letter-spacing:.4px;',
          'backdrop-filter:blur(4px);transition:background .15s,border-color .15s;}',
          '#_nm-btn:hover{background:rgba(30,40,70,0.97);border-color:rgba(100,180,255,0.7);}',
          '#_nm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;',
          'z-index:1800;background:rgba(0,0,0,0.55);}',
          '#_nm-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);',
          'z-index:1900;background:#0d1525;border:1.5px solid rgba(68,136,255,0.4);',
          'border-radius:16px;padding:0;width:360px;max-width:96vw;max-height:88vh;',
          'flex-direction:column;',
          'box-shadow:0 12px 50px rgba(0,0,0,0.85);font-family:Arial,sans-serif;}',
          '#_nm-head{padding:16px 18px 0;flex-shrink:0;}',
          '#_nm-title{color:#7ecfff;font-size:13px;font-weight:bold;text-align:center;',
          'letter-spacing:.6px;margin-bottom:10px;}',
          '#_nm-close{position:absolute;top:10px;right:12px;background:none;border:none;',
          'color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;padding:2px 7px;border-radius:4px;}',
          '#_nm-close:hover{color:#fff;background:rgba(255,255,255,0.08);}',
          '#_nm-stats{color:rgba(255,255,255,0.4);font-size:10px;text-align:center;margin-bottom:8px;}',
          '#_nm-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);',
          'border:1px solid rgba(255,255,255,0.12);border-radius:7px;color:#fff;',
          'font-family:Arial,sans-serif;font-size:12px;padding:7px 10px;outline:none;',
          'margin-bottom:10px;}',
          '#_nm-search:focus{border-color:rgba(100,180,255,0.5);}',
          '#_nm-list-wrap{overflow-y:auto;flex:1;min-height:0;padding:0 14px;}',
          '._nm-item{display:flex;align-items:center;gap:6px;padding:5px 0;',
          'border-bottom:1px solid rgba(255,255,255,0.05);}',
          '._nm-item:last-child{border-bottom:none;}',
          '._nm-idx{color:rgba(255,255,255,0.2);font-size:10px;min-width:22px;text-align:right;flex-shrink:0;}',
          '._nm-name{flex:1;color:#ddd;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}',
          '._nm-edit-input{flex:1;background:rgba(100,160,255,0.12);border:1px solid rgba(100,180,255,0.5);',
          'border-radius:5px;color:#fff;font-family:Arial,sans-serif;font-size:12px;',
          'padding:3px 7px;outline:none;}',
          '._nm-btn-sm{border:none;border-radius:5px;padding:3px 8px;font-size:10px;',
          'font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;flex-shrink:0;transition:opacity .12s;}',
          '._nm-btn-sm:hover{opacity:.75;}',
          '._nm-btn-edit{background:rgba(100,180,255,0.2);color:#7ecfff;}',
          '._nm-btn-ok{background:rgba(80,200,120,0.25);color:#6eda8a;}',
          '._nm-btn-del{background:rgba(220,60,60,0.2);color:#e07070;}',
          '._nm-btn-cancel{background:rgba(255,255,255,0.1);color:#bbb;}',
          '#_nm-add{padding:10px 14px;border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0;}',
          '#_nm-add-row{display:flex;gap:6px;}',
          '#_nm-add-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);',
          'border-radius:7px;color:#fff;font-family:Arial,sans-serif;font-size:12px;',
          'padding:7px 10px;outline:none;}',
          '#_nm-add-input:focus{border-color:rgba(100,180,255,0.5);}',
          '#_nm-add-btn{background:rgba(100,180,255,0.25);border:1px solid rgba(100,180,255,0.4);',
          'color:#7ecfff;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:bold;',
          'cursor:pointer;white-space:nowrap;}',
          '#_nm-add-btn:hover{background:rgba(100,180,255,0.4);}',
          '#_nm-footer{padding:8px 14px 12px;display:flex;gap:6px;justify-content:space-between;',
          'border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0;}',
          '#_nm-reset{background:rgba(220,120,40,0.2);border:1px solid rgba(220,120,40,0.35);',
          'color:#e0a060;border-radius:7px;padding:6px 10px;font-size:10px;font-weight:bold;cursor:pointer;}',
          '#_nm-reset:hover{background:rgba(220,120,40,0.35);}',
          '#_nm-status{color:rgba(255,255,255,0.35);font-size:10px;align-self:center;flex:1;text-align:right;}'
        ].join('');
        document.head.appendChild(style);

        /* ── BUTTON ── */
        var btn = document.createElement('button');
        btn.id = '_nm-btn';
        btn.textContent = '📝 Имена ботов';
        document.body.appendChild(btn);
        setInterval(function() {
          var phase = window._gamePhase || 'menu';
          btn.style.display = (phase === 'menu') ? '' : 'none';
        }, 200);

        /* ── OVERLAY ── */
        var overlay = document.createElement('div');
        overlay.id = '_nm-overlay';
        document.body.appendChild(overlay);

        /* ── PANEL ── */
        var panel = document.createElement('div');
        panel.id = '_nm-panel';
        panel.innerHTML =
          '<div id="_nm-head">' +
            '<div id="_nm-title">📝 Имена ботов</div>' +
            '<button id="_nm-close" title="Закрыть">✕</button>' +
            '<div id="_nm-stats"></div>' +
            '<input id="_nm-search" type="text" placeholder="🔍 Поиск по именам..." />' +
          '</div>' +
          '<div id="_nm-list-wrap"></div>' +
          '<div id="_nm-add">' +
            '<div id="_nm-add-row">' +
              '<input id="_nm-add-input" type="text" placeholder="Новое имя..." maxlength="32" />' +
              '<button id="_nm-add-btn">+ Добавить</button>' +
            '</div>' +
          '</div>' +
          '<div id="_nm-footer">' +
            '<button id="_nm-reset">↺ Сброс к умолчанию</button>' +
            '<div id="_nm-status"></div>' +
          '</div>';
        document.body.appendChild(panel);

        var listWrap = panel.querySelector('#_nm-list-wrap');
        var searchInput = panel.querySelector('#_nm-search');
        var addInput = panel.querySelector('#_nm-add-input');
        var statusEl = panel.querySelector('#_nm-status');
        var statsEl = panel.querySelector('#_nm-stats');
        var currentNames = [];
        var filterText = '';

        function setStatus(msg, color) {
          statusEl.style.color = color || '#6ada8a';
          statusEl.textContent = msg;
          setTimeout(function() {
            statusEl.style.color = 'rgba(255,255,255,0.35)';
            statusEl.textContent = '';
          }, 2000);
        }

        function updateStats() {
          var shown = filterText
            ? currentNames.filter(function(n) { return n.toLowerCase().indexOf(filterText) >= 0; }).length
            : currentNames.length;
          statsEl.textContent = filterText
            ? ('Показано: ' + shown + ' из ' + currentNames.length)
            : ('Всего имён: ' + currentNames.length);
        }

        function renderList() {
          editingIdx = -1;
          listWrap.innerHTML = '';
          var filter = filterText;
          var visible = currentNames.map(function(n, i) { return { name: n, idx: i }; });
          if (filter) {
            visible = visible.filter(function(e) { return e.name.toLowerCase().indexOf(filter) >= 0; });
          }
          if (visible.length === 0) {
            var empty = document.createElement('div');
            empty.style.cssText = 'color:rgba(255,255,255,0.3);font-size:12px;text-align:center;padding:20px;';
            empty.textContent = filter ? 'Ничего не найдено' : 'Список пуст';
            listWrap.appendChild(empty);
            updateStats();
            return;
          }
          visible.forEach(function(entry) {
            var row = document.createElement('div');
            row.className = '_nm-item';
            row.dataset.idx = entry.idx;

            var idxEl = document.createElement('span');
            idxEl.className = '_nm-idx';
            idxEl.textContent = (entry.idx + 1) + '.';
            row.appendChild(idxEl);

            var nameEl = document.createElement('span');
            nameEl.className = '_nm-name';
            nameEl.title = entry.name;
            nameEl.textContent = entry.name;
            row.appendChild(nameEl);

            var editBtn = document.createElement('button');
            editBtn.className = '_nm-btn-sm _nm-btn-edit';
            editBtn.textContent = '✏';
            editBtn.title = 'Редактировать';
            editBtn.addEventListener('click', function() { startEdit(row, entry.idx); });
            row.appendChild(editBtn);

            var delBtn = document.createElement('button');
            delBtn.className = '_nm-btn-sm _nm-btn-del';
            delBtn.textContent = '✕';
            delBtn.title = 'Удалить';
            delBtn.addEventListener('click', function() {
              currentNames.splice(entry.idx, 1);
              saveNames(currentNames);
              renderList();
              setStatus('Удалено: ' + entry.name, '#e07070');
            });
            row.appendChild(delBtn);

            listWrap.appendChild(row);
          });
          updateStats();
        }

        function startEdit(row, idx) {
          // Remove old inline editor if any
          var old = listWrap.querySelector('._nm-edit-row');
          if (old) old.parentNode.removeChild(old);

          var editRow = document.createElement('div');
          editRow.className = '_nm-item _nm-edit-row';

          var idxEl = document.createElement('span');
          idxEl.className = '_nm-idx';
          idxEl.textContent = (idx + 1) + '.';
          editRow.appendChild(idxEl);

          var inp = document.createElement('input');
          inp.className = '_nm-edit-input';
          inp.value = currentNames[idx];
          inp.maxLength = 32;
          editRow.appendChild(inp);

          var okBtn = document.createElement('button');
          okBtn.className = '_nm-btn-sm _nm-btn-ok';
          okBtn.textContent = '✔';
          okBtn.title = 'Сохранить';
          okBtn.addEventListener('click', function() {
            var v = inp.value.trim();
            if (!v) { setStatus('Имя не может быть пустым', '#e07070'); return; }
            currentNames[idx] = v;
            saveNames(currentNames);
            renderList();
            setStatus('Сохранено: ' + v);
          });
          editRow.appendChild(okBtn);

          var cancelBtn = document.createElement('button');
          cancelBtn.className = '_nm-btn-sm _nm-btn-cancel';
          cancelBtn.textContent = '✕';
          cancelBtn.title = 'Отмена';
          cancelBtn.addEventListener('click', renderList);
          editRow.appendChild(cancelBtn);

          inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') okBtn.click();
            if (e.key === 'Escape') cancelBtn.click();
          });

          row.parentNode.insertBefore(editRow, row.nextSibling);
          row.parentNode.removeChild(row);
          inp.focus();
          inp.select();
        }

        function addName() {
          var v = addInput.value.trim();
          if (!v) { addInput.focus(); return; }
          if (v.length > 32) { setStatus('Максимум 32 символа', '#e07070'); return; }
          currentNames.push(v);
          saveNames(currentNames);
          addInput.value = '';
          searchInput.value = '';
          filterText = '';
          renderList();
          // Scroll to bottom to show new name
          setTimeout(function() { listWrap.scrollTop = listWrap.scrollHeight; }, 50);
          setStatus('Добавлено: ' + v);
          addInput.focus();
        }

        /* ── EVENTS ── */
        searchInput.addEventListener('input', function() {
          filterText = this.value.trim().toLowerCase();
          renderList();
        });

        addInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addName(); });
        panel.querySelector('#_nm-add-btn').addEventListener('click', addName);

        panel.querySelector('#_nm-reset').addEventListener('click', function() {
          if (!confirm('Сбросить к именам из файла names.js? Все изменения будут удалены.')) return;
          try { localStorage.removeItem(CUSTOM_KEY); } catch(e) {}
          currentNames = getDefaultNames();
          saveNames(currentNames);
          searchInput.value = '';
          filterText = '';
          renderList();
          setStatus('Сброшено к умолчанию', '#e0a060');
        });

        function openPanel() {
          currentNames = loadNames();
          filterText = '';
          searchInput.value = '';
          addInput.value = '';
          renderList();
          panel.style.display = 'flex';
          overlay.style.display = 'block';
          searchInput.focus();
        }

        function closePanel() {
          panel.style.display = 'none';
          overlay.style.display = 'none';
        }

        btn.addEventListener('click', openPanel);
        overlay.addEventListener('click', closePanel);
        panel.querySelector('#_nm-close').addEventListener('click', closePanel);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
      }

      if (document.body) init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
